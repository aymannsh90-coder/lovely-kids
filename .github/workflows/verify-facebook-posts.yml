name: Verify Facebook Page product publishing
on:
  pull_request:
    branches: [main]
    paths:
      - 'artifacts/api-worker/src/facebook-*'
      - 'artifacts/api-worker/src/owner-story-*'
      - 'artifacts/api-worker/src/db.ts'
      - 'artifacts/api-worker/src/index.ts'
      - 'artifacts/lovely-kids/app/admin/facebook-posts.tsx'
      - 'artifacts/lovely-kids/app/admin/index.tsx'
      - '.github/workflows/verify-facebook-posts.yml'
jobs:
  facebook-publishing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-worker typecheck
      - run: node --experimental-strip-types --test artifacts/api-worker/src/facebook-post-composer.test.mjs artifacts/api-worker/src/facebook-page-access-token.test.mjs artifacts/api-worker/src/owner-story-meta-publish.test.mjs
      - run: pnpm --filter @workspace/lovely-kids typecheck
