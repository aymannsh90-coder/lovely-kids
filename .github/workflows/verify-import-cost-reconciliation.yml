name: Verify import draft and cost preflight

on:
  pull_request:
    branches: [main]
    paths:
      - 'artifacts/api-worker/src/import-cost-*'
      - 'artifacts/api-worker/src/index.ts'
      - 'artifacts/lovely-kids-pos/src/pages/purchases/ImportCostPage.tsx'
      - 'artifacts/lovely-kids-pos/src/app/router.tsx'
      - 'artifacts/lovely-kids-pos/src/app/navigation.ts'
      - 'artifacts/lovely-kids-pos/src/lib/api.ts'
      - 'lib/db/src/schema/import-costs.ts'
      - 'lib/db/src/schema/index.ts'
      - 'lib/db/migrations/20261109_create_import_cost_drafts.sql'
      - '.github/workflows/verify-import-cost-reconciliation.yml'
  workflow_dispatch:

jobs:
  validate-import-costs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: API Worker typecheck
        run: pnpm --filter @workspace/api-worker typecheck
      - name: POS typecheck
        run: pnpm --filter @workspace/lovely-kids-pos typecheck
      - name: POS build
        run: pnpm --filter @workspace/lovely-kids-pos build
      - name: Import cost unit tests
        run: node --experimental-strip-types --test artifacts/api-worker/src/import-cost-reconciliation.test.mjs

  validate-import-migration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tester
          POSTGRES_PASSWORD: testonly
          POSTGRES_DB: import_cost_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tester -d import_cost_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: tester
      PGPASSWORD: testonly
      PGDATABASE: import_cost_test
    steps:
      - uses: actions/checkout@v4
      - name: Create mock referenced tables
        run: psql -v ON_ERROR_STOP=1 -f artifacts/api-worker/src/import-cost-migration.fixture.sql
      - name: Apply draft-only migration to disposable database
        run: psql -v ON_ERROR_STOP=1 -f lib/db/migrations/20261109_create_import_cost_drafts.sql
      - name: Verify FK, unique, amount and RLS constraints
        run: psql -v ON_ERROR_STOP=1 -f artifacts/api-worker/src/import-cost-migration.verify.sql
