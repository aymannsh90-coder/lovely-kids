name: Check Cloudflare deployment access for purchase returns
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/check-cloudflare-access.yml'
jobs:
  cloudflare-access:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployment secrets availability without exposing values
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "Cloudflare API token: configured"
          else
            echo "::warning::Cloudflare API token is not configured in GitHub Actions"
          fi
          if [ -n "$CF_ACCOUNT_ID" ]; then
            echo "Cloudflare account ID: configured"
          else
            echo "::warning::Cloudflare account ID is not configured in GitHub Actions"
          fi
