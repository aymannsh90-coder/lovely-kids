name: POS Product Management Check

on:
  push:
    branches:
      - feature/pos-product-management

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: POS typecheck
        run: pnpm --filter @workspace/lovely-kids-pos typecheck

      - name: POS build
        run: pnpm --filter @workspace/lovely-kids-pos build

      - name: Store typecheck
        run: pnpm --filter @workspace/lovely-kids typecheck

      - name: Store build
        run: pnpm --filter @workspace/lovely-kids build
