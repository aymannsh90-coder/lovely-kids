name: Verify Lovely Kids orders and exchange edits
on:
  push:
    branches:
      - main
      - fix/online-exchange-edit-and-void-20261028
  pull_request:
    branches:
      - main
jobs:
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tester
          POSTGRES_PASSWORD: testonly
          POSTGRES_DB: purchase_returns_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tester -d purchase_returns_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: tester
      PGPASSWORD: testonly
      PGDATABASE: purchase_returns_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-worker typecheck
      - run: node --experimental-strip-types --test artifacts/api-worker/src/cost-return-confidence.test.mjs
      - run: node --experimental-strip-types --test artifacts/api-worker/src/historical-exchange-reconciliation.test.mjs
      - run: node --experimental-strip-types --test artifacts/api-worker/src/salary-month-close-rules.test.mjs
      - run: pnpm --filter @workspace/lovely-kids typecheck
      - run: pnpm --filter @workspace/lovely-kids build
      - run: pnpm --filter @workspace/lovely-kids-pos typecheck
      - run: pnpm --filter @workspace/lovely-kids-pos build
      - name: Verify purchase return rounding and quantities
        run: node --experimental-strip-types --test artifacts/api-worker/src/purchase-return-rules.test.mjs
      - name: Verify purchase return migration on disposable PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f artifacts/api-worker/src/purchase-return-migration.fixture.sql
          psql -v ON_ERROR_STOP=1 -f lib/db/migrations/20261103_create_purchase_returns.sql
          psql -v ON_ERROR_STOP=1 -f artifacts/api-worker/src/purchase-return-migration.verify.sql
