<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 58 38" role="img" aria-labelledby="title">
  <title id="title">Mastercard</title>
  <!-- Full-color intersecting circles in Mastercard's brand palette. -->
  <circle cx="21" cy="19" r="16.4" fill="#EB001B"/>
  <circle cx="37" cy="19" r="16.4" fill="#F79E1B"/>
  <defs><clipPath id="overlap"><circle cx="37" cy="19" r="16.4"/></clipPath></defs>
  <circle cx="21" cy="19" r="16.4" fill="#FF5F00" clip-path="url(#overlap)"/>
</svg>